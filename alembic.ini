[alembic]
# Path to migration scripts, relative to this file.
script_location = app/database/migrations

# Template for new migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No timezone-naming/version-locations trickery needed -- one linear
# history under versions/.
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank.
# app/database/migrations/env.py reads DATABASE_URL from
# app/core/config.py at runtime.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
